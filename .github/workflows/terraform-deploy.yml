name: Terraform deploy

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "infra/**"
      - ".github/workflows/terraform-deploy.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform operation"
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
          - destroy
      confirm_apply:
        description: 'For apply, type "APPLY" after reviewing a plan.'
        required: false
        type: string
      confirm_destroy:
        description: 'Required only for destroy. Type "DESTROY" to confirm.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: terraform-cloud-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  terraform:
    needs: validate
    name: Terraform ${{ github.event.inputs.action || 'plan' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: infra

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_cluster_role_name: ${{ vars.EKS_CLUSTER_ROLE_NAME }}
      TF_VAR_node_role_name: ${{ vars.EKS_NODE_ROLE_NAME }}
      TF_VAR_datadog_api_key: ${{ secrets.DATADOG_API_KEY }}
      TF_VAR_auth_lambda_arns: ${{ vars.AUTH_LAMBDA_ARNS || 'null' }}
      TF_VAR_private_gateway_routes: ${{ vars.PRIVATE_GATEWAY_ROUTES || 'disabled' }}
      TF_IN_AUTOMATION: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prevent apply outside main
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply' && (github.ref_name != 'main' || github.event.inputs.confirm_apply != 'APPLY')
        run: |
          echo "::error::Manual apply requires main and confirm_apply=APPLY."
          exit 1

      - name: Prevent destroy unless explicitly confirmed on main
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy' && (github.ref_name != 'main' || github.event.inputs.confirm_destroy != 'DESTROY')
        run: |
          echo "::error::Manual destroy is allowed only from main and requires confirm_destroy=DESTROY."
          exit 1

      - name: Check required configuration
        run: |
          set -euo pipefail
          for name in AWS_REGION AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN TF_VAR_cluster_role_name TF_VAR_node_role_name TF_VAR_datadog_api_key TF_STATE_BUCKET; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is not configured in the repository or organization."
              exit 1
            fi
          done

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Verify AWS Academy session
        run: aws sts get-caller-identity

      - name: Initialize Terraform
        run: |
          terraform init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="region=$AWS_REGION"

      - name: Plan
        if: github.event.inputs.action != 'destroy'
        run: terraform plan -input=false -out=tfplan

      - name: Destroy plan
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy' && github.ref_name == 'main' && github.event.inputs.confirm_destroy == 'DESTROY'
        run: terraform plan -destroy -input=false -out=tfplan

      - name: Apply
        if: github.ref_name == 'main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply' && github.event.inputs.confirm_apply == 'APPLY'))
        run: terraform apply -input=false -auto-approve tfplan

      - name: Destroy
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy' && github.ref_name == 'main' && github.event.inputs.confirm_destroy == 'DESTROY'
        run: terraform apply -input=false -auto-approve tfplan
