name: Terraform bootstrap
run-name: Terraform bootstrap / ${{ inputs.operation }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'plan cria um artefato para revisão; apply usa exatamente esse plano; verify consulta o resultado'
        type: choice
        required: true
        default: plan
        options: [plan, apply, verify]
      account_id:
        description: 'ID de 12 dígitos da nova conta Academy, confirmado pelo operador'
        type: string
        required: true
      plan_run_id:
        description: 'Somente apply: ID da execução plan revisada, no mesmo commit'
        type: string
        required: false
      confirm_apply:
        description: 'Somente apply: token APPLY:conta:bucket:SHA256 informado pelo plan'
        type: string
        required: false

permissions:
  contents: read
  actions: read

# Global across refs/operations: one operator for the shared bootstrap state.
concurrency:
  group: numberone-terraform-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
      BOOTSTRAP_ACCOUNT: ${{ inputs.account_id }}
      BOOTSTRAP_PLAN_RUN_ID: ${{ inputs.plan_run_id }}
      BOOTSTRAP_CONFIRMATION: ${{ inputs.confirm_apply }}
      BOOTSTRAP_OPERATION: ${{ inputs.operation }}
      TF_IN_AUTOMATION: 'true'

    steps:
      - name: Checkout selected commit
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Validate scripts locally
        run: |
          bash -n scripts/bootstrap-state.sh scripts/bootstrap-state-ci.sh
          ./scripts/bootstrap-state.sh check --bootstrap-only

      - name: Restore checkpoint and execute explicit operation
        env:
          GH_TOKEN: ${{ github.token }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: ./scripts/bootstrap-state-ci.sh "$BOOTSTRAP_OPERATION"

      - name: Preserve bootstrap checkpoint even after partial apply
        if: always() && inputs.operation == 'apply'
        run: ./scripts/bootstrap-state-ci.sh checkpoint

      - name: Upload reviewed-plan bundle
        if: success() && inputs.operation == 'plan'
        uses: actions/upload-artifact@v4
        with:
          name: numberone-phase4-bootstrap-plan
          path: infra/bootstrap/.terraform/ci-transfer/upload/plan.tar
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true

      - name: Upload bootstrap state checkpoint
        if: always() && inputs.operation == 'apply'
        uses: actions/upload-artifact@v4
        with:
          name: numberone-phase4-bootstrap-state
          path: infra/bootstrap/.terraform/ci-transfer/upload/state.tar
          if-no-files-found: warn
          retention-days: 90
          include-hidden-files: true
