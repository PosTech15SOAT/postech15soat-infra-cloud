name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Required validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate repository structure
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test -s README.md
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            git diff-tree --check --no-commit-id --root -r "$HEAD_SHA"
          else
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize bootstrap configuration
        working-directory: infra/bootstrap
        run: terraform init -backend=false -input=false

      - name: Validate bootstrap configuration
        working-directory: infra/bootstrap
        run: terraform validate

      - name: Initialize cloud configuration without backend
        working-directory: infra
        run: terraform init -backend=false -input=false

      - name: Validate cloud configuration
        working-directory: infra
        run: terraform validate
